# Push a tag that matches manifest.json's version (e.g. `git tag 0.1.0 && git push origin 0.1.0`).
# This builds the plugin and creates a draft GitHub release with main.js and manifest.json attached.
name: Release
on:
  push:
    tags: ["*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check tag matches manifest version
        run: test "$(node -p 'require("./manifest.json").version')" = "${GITHUB_REF_NAME}"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft --generate-notes main.js manifest.json
